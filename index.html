<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Harmanat Singh</title>
<meta name="description" content="Links to the SM Amar Singh family tree and the Grey Bulls cricket club.">
<meta name="theme-color" content="#16181b">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2316181b'/%3E%3Ctext x='32' y='42' font-family='Georgia,serif' font-size='28' font-weight='700' text-anchor='middle' fill='%23c9a24a'%3EHS%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #16181b;
    --card: #202327;
    --line: rgba(255,255,255,.07);
    --ink: #ece8e1;
    --muted: #a19c93;
    --gold: #c9a24a;
    --gold-soft: rgba(201,162,74,.14);
    --sage: #7fa58c;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background:
      radial-gradient(70% 50% at 50% 0%, rgba(201,162,74,.08), rgba(201,162,74,0) 70%),
      var(--bg);
    color: var(--ink);
    font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
    line-height: 1.55;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    -webkit-font-smoothing: antialiased;
  }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  main { flex: 1; width: 100%; max-width: 940px; margin: 0 auto; padding: 64px 20px 72px; display: flex; align-items: center; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; width: 100%; }
  .card {
    display: flex; flex-direction: column;
    background: var(--card); border: 1px solid var(--line); border-radius: 18px; overflow: hidden;
    color: inherit; text-decoration: none;
    box-shadow: 0 1px 2px rgba(0,0,0,.4), 0 18px 48px rgba(0,0,0,.35);
    transition: transform .3s ease, border-color .3s ease, box-shadow .3s ease;
  }
  .card:hover { transform: translateY(-5px); border-color: rgba(201,162,74,.45); box-shadow: 0 2px 4px rgba(0,0,0,.45), 0 26px 64px rgba(0,0,0,.5); }
  .card:focus-visible { outline: 2px solid var(--gold); outline-offset: 4px; }
  .thumb { aspect-ratio: 16 / 10; position: relative; overflow: hidden; background: #0f1113; }
  .thumb img { display: block; width: 100%; height: 100%; object-fit: cover; transition: transform .8s ease, filter .8s ease; }
  .thumb.family img { object-position: center 0%; filter: sepia(.18) contrast(1.02); }
  .card:hover .thumb img { transform: scale(1.04); }
  .thumb::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(22,24,27,0) 55%, rgba(22,24,27,.55)); }
  .tag {
    position: absolute; left: 16px; bottom: 14px; z-index: 1;
    font-size: .7rem; font-weight: 600; letter-spacing: .14em; text-transform: uppercase;
    padding: 5px 11px; border-radius: 999px;
    color: var(--gold); background: rgba(22,24,27,.72);
    border: 1px solid rgba(201,162,74,.35);
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
  }
  .body { padding: 22px 24px 24px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
  .body h2 { font-family: Fraunces, Georgia, serif; font-weight: 600; font-size: 1.5rem; line-height: 1.2; letter-spacing: -0.01em; }
  .body p { color: var(--muted); font-size: .97rem; }
  .go { margin-top: auto; padding-top: 16px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .url { font-size: .86rem; color: var(--muted); }
  .btn {
    display: inline-flex; align-items: center; gap: 6px; flex-shrink: 0;
    font-size: .86rem; font-weight: 600; color: #16181b;
    background: var(--gold); padding: 8px 15px; border-radius: 999px;
    transition: gap .25s ease, background .25s ease;
  }
  .card:hover .btn { gap: 10px; background: #d8b45e; }
  .credit { position: fixed; right: 16px; bottom: 12px; font-size: .78rem; color: var(--muted); }
  .credit b { font-weight: 600; color: var(--gold); }
  @media (max-width: 700px) {
    main { padding-top: 28px; padding-bottom: 24px; align-items: flex-start; }
    .grid { grid-template-columns: 1fr; gap: 20px; }
    .credit { position: static; text-align: right; padding: 0 16px 16px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .card, .thumb img, .btn { transition: none; }
    .card:hover { transform: none; }
  }
</style>
</head>
<body>
<h1 class="sr-only">Harmanat Singh</h1>
<main>
  <div class="grid">
    <a class="card" href="/sm-amarsingh/">
      <div class="thumb family">
        <img src="assets/family.jpg" alt="Family elders seated together for a portrait">
        <span class="tag">Family</span>
      </div>
      <div class="body">
        <h2>SM Amar Singh Family Tree</h2>
        <p>Our family tree: generations, branches and the people who connect us.</p>
        <div class="go"><span class="url">harmanat.com/sm-amarsingh</span><span class="btn">Visit <span aria-hidden="true">&rarr;</span></span></div>
      </div>
    </a>

    <a class="card" href="https://greybulls.com">
      <div class="thumb">
        <img src="assets/greybulls.jpg" alt="Grey Bulls squad with the league trophy">
        <span class="tag">Cricket</span>
      </div>
      <div class="body">
        <h2>Grey Bulls</h2>
        <p>Our T20 cricket club: the squad, the silverware and the photo gallery.</p>
        <div class="go"><span class="url">greybulls.com</span><span class="btn">Visit <span aria-hidden="true">&rarr;</span></span></div>
      </div>
    </a>
  </div>
</main>
<p class="credit">Created by <b>Mannat</b></p>
</body>
</html>
